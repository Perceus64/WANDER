[package]
name = "wander-core"
version = "0.1.0"
edition = "2021"
description = "WANDER engine core: terrain storage, sculpting, painting, meshing and geo-data processing, compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
codegen-units = 1
